services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: detection_rag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-detection_rag}
      POSTGRES_USER: ${POSTGRES_USER:-detection_rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-local-env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-detection_rag} -d ${POSTGRES_DB:-detection_rag}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
