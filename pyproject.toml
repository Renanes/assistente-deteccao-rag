[project]
name = "agente-detection"
version = "0.1.0"
description = "Assistente de detecção com RAG sobre regras públicas (Sigma, Splunk ESCU, YARA-L)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
